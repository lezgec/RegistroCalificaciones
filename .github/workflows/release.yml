name: Publicar versión para Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la aplicación (ej. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore RegistroCalificaciones.csproj

      - name: Publicar aplicación
        run: >
          dotnet publish RegistroCalificaciones.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Crear ZIP portable
        shell: pwsh
        run: |
          if (Test-Path "RegistroCalificaciones-Windows-x64.zip") {
            Remove-Item "RegistroCalificaciones-Windows-x64.zip"
          }
          Compress-Archive -Path "publish\*" -DestinationPath "RegistroCalificaciones-Windows-x64.zip"

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Crear instalador Setup.exe
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $releaseVersion = "${{ inputs.version }}"
          } else {
            $releaseVersion = "${{ github.ref_name }}"
          }

          $cleanVersion = $releaseVersion.TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "No se encontró Inno Setup en $iscc"
          }

          & $iscc "/DMyAppVersion=$cleanVersion" "installer.iss"

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: master
          name: Registro de Calificaciones ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          body: |
            ## Registro de Calificaciones

            Aplicación de escritorio para Windows desarrollada en C# con WinForms y SQLite.

            ### Instalación recomendada
            Descarga **RegistroCalificaciones-Setup-x64.exe** y sigue el asistente de instalación.

            El instalador:
            - instala la aplicación para el usuario actual;
            - agrega un acceso directo al menú Inicio;
            - permite crear un acceso directo en el escritorio;
            - registra la aplicación para poder desinstalarla desde Configuración de Windows;
            - no requiere instalar .NET 8 por separado.

            ### Versión portable
            También puedes descargar **RegistroCalificaciones-Windows-x64.zip**, descomprimirlo y ejecutar `RegistroCalificaciones.exe`.

            La base de datos SQLite se crea automáticamente en el almacenamiento local del usuario.
          generate_release_notes: true
          files: |
            installer-output/RegistroCalificaciones-Setup-x64.exe
            RegistroCalificaciones-Windows-x64.zip
